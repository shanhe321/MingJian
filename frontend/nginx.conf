# =============================================================================
# RSOD Web Platform - Nginx 配置
# 功能: SPA 路由回退 + /api/ 反向代理至后端
# =============================================================================

server {
    listen 80;
    server_name _;

    # 字符集
    charset utf-8;

    # Gzip 压缩 —— 减少传输体积，提升加载速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;

    # ------------------------- 前端静态资源 -------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # SPA 路由回退：所有非文件请求均返回 index.html
        # 先尝试匹配静态文件 → 目录 → 最终回退到 index.html
        try_files $uri $uri/ /index.html;

        # 静态资源缓存策略（带 hash 的资源设置长缓存）
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 文件不缓存（确保前端更新即时生效）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ------------------------- API 反向代理 -------------------------
    # 所有 /api/ 请求转发至后端 FastAPI 服务
    location /api/ {
        # 后端服务地址（docker-compose 内部 DNS 解析）
        proxy_pass http://backend:8000;

        # 代理请求头设置
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理超时设置（适配长时间推理任务）
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 禁用代理缓冲 —— SSE/流式响应支持
        proxy_buffering off;

        # 上传文件大小限制（适配遥感图像上传）
        client_max_body_size 500M;
    }

    # ------------------------- 健康检查端点 -------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ------------------------- 安全加固 -------------------------
    # 隐藏 Nginx 版本号
    server_tokens off;

    # 安全响应头
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
