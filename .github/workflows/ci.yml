# =============================================================================
# RSOD Web Platform - CI 持续集成工作流
# 触发条件: Push 或 Pull Request 到 main / develop 分支
# =============================================================================

name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

# 确保同一分支同时只有一个 CI 运行，新的会取消旧的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ======================== 前端构建检查 ========================
  frontend-check:
    name: "前端: 构建 & 类型检查"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx vue-tsc --noEmit
        continue-on-error: true

      - name: 生产构建
        run: npm run build

      - name: 代码检查（ESLint）
        run: npx eslint . --ext .vue,.ts,.js --max-warnings 0
        continue-on-error: true

  # ======================== 后端语法检查 ========================
  backend-check:
    name: "后端: 语法 & 导入检查"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: 语法检查 (compileall)
        run: python -m compileall -q .

      - name: 代码格式化检查 (Ruff)
        uses: chartboost/ruff-action@v1
        continue-on-error: true

  # ======================== Docker Compose 配置验证 ========================
  compose-check:
    name: "验证 docker-compose 配置"
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Docker Compose 插件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker-compose-v2 2>/dev/null || true

      - name: 验证 YAML 语法
        run: python -c "import yaml; yaml.safe_load(open('docker-compose.server.yml'))"

      - name: 验证 Docker Compose 配置
        run: docker compose -f docker-compose.server.yml config --quiet 2>&1 || echo "跳过 compose config 检查（插件不可用，YAML 语法已验证通过）"
